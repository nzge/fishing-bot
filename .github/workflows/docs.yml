name: Docs

# Rebuild and publish the workspace documentation whenever the ROS 2 code or
# the docs sources change on main. Also buildable on PRs (without deploying)
# so broken docs are caught in review.
on:
  push:
    branches: [main]
    paths:
      - "software/src/**"
      - "software/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "software/src/**"
      - "software/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/docs/requirements.pip

      - name: Install docs toolchain
        run: pip install -r software/docs/requirements.pip

      - name: Build HTML (warnings are errors)
        run: make -C software/docs html SPHINXOPTS="-W --keep-going"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: software/docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
